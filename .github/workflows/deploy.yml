name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Astro
        # Installs dependencies, runs the build, and uploads dist/ as the
        # Pages artifact. Image processing takes a couple of minutes.
        uses: withastro/action@v3
        with:
          # The action defaults to a Node version Astro 7 refuses to run on
          # ("Node.js v20 is not supported, please upgrade to >=22.12.0").
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
